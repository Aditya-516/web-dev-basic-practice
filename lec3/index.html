<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 0;
      }
      body{
          background: linear-gradient(to right, #87CEEB, #00BFFF);
          display: flex;
          justify-content: center;
          flex-direction: row;
          align-items: center;
      }
      .page{
        padding: 12px;
        background-color: lightblue;
        border: 2px solid black;
        border-radius: 20px;
        width: 200px;
        text-align: center;
        

      }
      h1{
        padding: 12px;
        color: red;
      }
      p{
        color: rgb(255, 196, 197);
        text-decoration: underline;
        padding: 12px;

      }
      img{
        border-radius: 12px;
        width: 140px;
        height: 140px;
      }

      
    </style>
  </head>
  <body>
    <div class="container">
        
        <div class="page">
            <img src="ghost.png" alt="ghost_image" >
            <h1 class="name">Jon Deo</h1>
            <p>Web devloper</p>
        </div>
    </div>
  </body>
</html>
