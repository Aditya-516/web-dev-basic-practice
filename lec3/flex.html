<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: antiquewhite;
        }
        .container{

            width: 80%;
            height: 200px;
            margin: auto;
            border-radius: 12px;
            border: 2px solid;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: row;
            background-color: steelblue;

        }
        .box{
            border: 2px solid;
            border-radius: 12px;
            width: 80px;
            height: 100px;
            background-color: skyblue;
            margin: 18px;


        }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">box-1</div>
      <div class="box">box-2</div>
      <div class="box">box-3</div>
    </div>
  </body>
</html>
